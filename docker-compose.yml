version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: rolecompass_postgres
    restart: always
    environment:
      POSTGRES_DB: rolecompass
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432" # <-- CHANGED THIS LINE
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: