version: '3.9'

# ==============================================================================
# RoleCompass — Full Stack Docker Compose
# Starts all 4 services with health checks and correct startup order.
# Usage: docker compose up --build
# ==============================================================================

services:

  # ── 1. PostgreSQL Database ─────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: rolecompass_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rolecompass
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rolecompass"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── 2. Python ML Service (FastAPI) ─────────────────────────────────────────
  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: rolecompass_ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── 3. Spring Boot Backend ─────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rolecompass_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ml:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/rolecompass
      DB_USERNAME: postgres
      DB_PASSWORD: password
      PORT: 8080
      ML_SERVICE_URL: http://ml:8000
      JWT_SECRET_KEY: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── 4. React Frontend (Nginx-served production build) ──────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rolecompass_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5174:80"

volumes:
  postgres_data: