spring:
  application:
    name: rolecompass-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/rolecompass}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:8080}

application:
  security:
    jwt:
      # Base64 encoded 256-bit secret key (HMAC-SHA256)
      secret-key: ${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration: 86400000 # 24 hours in milliseconds

ml:
  service:
    url: ${ML_SERVICE_URL:http://localhost:8000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized

